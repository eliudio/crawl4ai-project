[project]
name = "crawl4ai-project"
version = "0.1.0"
description = "Web crawling & extraction experiments with Crawl4AI"
authors = [
    {name = "Johan Witters"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    # Add your runtime deps here, e.g., "crawl4ai = '^0.4'",
    "crawl4ai (>=0.8.0,<0.9.0)",
    "requests (>=2.32.5,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "ollama (>=0.6.1,<0.7.0)",
    "llama-index (>=0.14.12,<0.15.0)",
    "firecrawl (>=4.13.0,<5.0.0)",
    "firecrawl-py (>=4.13.0,<5.0.0)",
    "openai (>=2.15.0,<3.0.0)",
    "selenium (>=4.40.0,<5.0.0)",
    "sqlalchemy (>=2.0.36,<3.0.0)",
    "psycopg[binary] (>=3.2.3,<4.0.0)",
    "google-cloud-pubsub (>=2.27.0,<3.0.0)",
    "fastapi (>=0.115.6,<1.0.0)",
    "uvicorn (>=0.34.0,<1.0.0)",
    "anthropic (>=0.40.0,<1.0.0)",
    "tenacity (>=9.0.0,<10.0.0)",
    "pydantic-settings (>=2.7.0,<3.0.0)",
    "markdownify (>=1.2.3,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "services", from = "src" }
]

# Optional: Add your other tool configs here if needed, e.g.,
# [tool.ruff]
# line-length = 100
# etc.
[dependency-groups]
dev = [
    "ruff (>=0.14.13,<0.15.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "rich (>=14.2.0,<15.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "types-requests (>=2.32.4.20260107,<3.0.0.0)"
]
